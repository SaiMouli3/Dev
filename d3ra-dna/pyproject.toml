[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "d3ra-dna"
version = "0.1.0"
description = "D3RA-DNA: Distributed DNA Reliability and Retrieval Architecture (simulation research prototype)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "reedsolo>=1.7",
  "matplotlib>=3.8",
  "networkx>=3.0",
  "edlib>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=7", "hypothesis>=6"]
dashboard = ["streamlit>=1.30"]

[project.scripts]
d3ra = "d3ra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
